name: Build FAP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: pip install ufbt

      - name: Deploy Momentum SDK
        run: ufbt update --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=release

      - name: Build FAP
        run: ufbt

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: subghz_bruteforce-fap
          path: dist/*.fap
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*.fap
          --title "SubGHz Bruteforce ${{ github.ref_name }}"
          --notes "Sub-GHz dictionary bruteforcer FAP for Momentum firmware. Install by copying the .fap into the SD card's apps/ folder or sideloading with qFlipper."
